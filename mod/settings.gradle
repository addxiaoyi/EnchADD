pluginManagement {
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'net.fabricmc.fabric-loom') {
                useModule('net.fabricmc.fabric-loom-remap:net.fabricmc.fabric-loom-remap.gradle.plugin:1.18-SNAPSHOT')
            }
        }
    }
    repositories {
        maven { url = uri('https://maven.fabricmc.net/') }
        maven { url = uri('https://maven.minecraftforge.net/') }
        maven { url = uri('https://maven.neoforged.net/releases') }
        gradlePluginPortal()
        mavenCentral()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}
rootProject.name = 'enchadd-mod'
include(':common', ':fabric-1.21.1', ':fabric-1.21.2', ':fabric-1.21.6', ':fabric-1.21.11', ':fabric-26.3', ':forge-1.21.1', ':forge-1.21.3', ':forge-1.21.6', ':forge-1.21.11', ':forge-26.3', ':neoforge-1.21.1', ':neoforge-1.21.3', ':neoforge-1.21.8', ':neoforge-1.21.11', ':neoforge-26.3')
