            assert (parsed.supported_items as Set) == weaponItems:
                    "${id} must match the Paper sword/axe/trident allowlist"
            assert parsed.effects == [:]: "${id} must use the shared melee adapter only"
        }
        def rally = parser.parse(new File(enchantDir, 'rally.json'))
        assert rally.max_level == 3 && rally.slots == ['chest']
        assert (rally.supported_items as Set) == chestplates:
                'Rally must match the Paper chestplate allowlist'
        assert rally.effects == [:]: 'Rally must use the shared melee adapter only'
        expectedEffects.each { id, effectKey ->
            def file = new File(enchantDir, "${id}.json")
            assert file.isFile(): "Missing migrated enchantment ${id}"
            def parsed = parser.parse(file)
            assert parsed.effects?.containsKey(effectKey): "${id} missing expected effect ${effectKey}"
        }
    }
}

