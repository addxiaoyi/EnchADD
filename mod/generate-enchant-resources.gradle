import groovy.json.JsonOutput
import groovy.json.JsonSlurper

def catalogFile = rootProject.name == 'enchadd-mod'
        ? rootProject.file('common/src/main/resources/data/enchadd/enchantments.list')
        : rootProject.file('../common/src/main/resources/data/enchadd/enchantments.list')
def generatedDir = layout.buildDirectory.dir('generated/enchadd-resources').get().asFile
def is26_3 = project.projectDir.name.endsWith('26.3')
def requirementType = is26_3 ? 'type' : 'condition'
def requirement = { String type, Map fields = [:] -> [(requirementType): type] + fields }
def damageTagId = { String tag -> is26_3 ? "#minecraft:${tag}" : "minecraft:${tag}" }
def catalog = catalogFile.readLines('UTF-8')
        .collect { it.trim() }
        .findAll { it && !it.startsWith('#') }
        .collect { it.split('\\|', -1) }

def normalIds = catalog.findAll { it[1] == 'normal' }.collect { it[0] }
def curseIds = catalog.findAll { it[1] == 'curse' }.collect { it[0] }
def maxLevelFor = { String id, boolean curse ->
    if (id == 'overwhelm') return 2
    if (id == 'executioner') return 5
    if (id == 'beheading') return 1
    ['greed', 'misfortune', 'fragility', 'shatter'].contains(id) ? 3 : (curse ? 1 : 3)
}
def exclusiveSetFor = { String id ->
    if (id in ['executioner', 'decapitate']) return 'enchadd:exclusive_set/executioner_decapitate'
    if (id == 'beheading') return 'enchadd:exclusive_set/beheading_looting'
    null
}
def spearIds = ['lancer', 'reach', 'skewer', 'counterthrust'] as Set
def itemGroups = [
        shield  : ['barrier', 'brace', 'bulwark', 'holdfast', 'parry', 'pivot', 'riposte', 'ward'] as Set,
        bow     : ['bind', 'farshot', 'hunters_mark', 'mortal_wound', 'ricochet', 'steady_aim', 'stillness', 'volley'] as Set,
        crossbow: ['flare', 'obscure', 'steady_aim'] as Set,
        fishing : ['freshcatch', 'trawler'] as Set,
        mining  : ['arborist', 'delvesense', 'furrow', 'insight', 'irrigation', 'refine', 'replanting', 'smelting', 'stonewake', 'telepathy', 'trailblazer'] as Set,
        mace    : ['meteor', 'overwhelm', 'tremor', 'updraft'] as Set,
        armor   : ['airbag', 'afterglide', 'arrowguard', 'blastguard', 'defense', 'firebreak', 'fireguard', 'fortitude', 'frostguard', 'insomnia', 'panic', 'purify', 'shroud', 'vampirism_curse'] as Set,
        chest   : ['debilitate', 'rally'] as Set,
        feet    : ['evasion', 'featherstep'] as Set,
        trident : ['cadence', 'cinder', 'highground', 'initiative', 'lodestar', 'measured', 'momentum', 'poise', 'pursuit', 'resonance', 'shadowstrike', 'tide_runner', 'tracer', 'undertow', 'underdog', 'wingclip'] as Set,
        weapon  : ['backfire', 'beheading', 'breakguard', 'decapitate', 'executioner', 'frostbrand', 'greed', 'hemorrhage', 'immolate', 'misfortune', 'rashness', 'shatter', 'sunder'] as Set
]

def supportedItems = { String id ->
    def catalogEntry = catalog.find { it[0] == id }
    if (catalogEntry?.size() > 2 && catalogEntry[2].trim()) {
        return catalogEntry[2].split(';').collect { it.trim() }
    }
    if (spearIds.contains(id)) {
        return ['minecraft:wooden_spear', 'minecraft:stone_spear', 'minecraft:copper_spear',
                'minecraft:iron_spear', 'minecraft:golden_spear', 'minecraft:diamond_spear',
                'minecraft:netherite_spear', 'minecraft:trident']
    }
    def group = itemGroups.find { it.value.contains(id) }
    def tagName = [shield: 'durability', chest: 'chest_armor', feet: 'foot_armor'][group?.key] ?: group?.key
    return group ? "#minecraft:enchantable/${tagName}" : '#minecraft:enchantable/durability'
}

def slotsFor = { String id ->
    if (id == 'fragility') return ['any']
    if (itemGroups.shield.contains(id)) return ['offhand']
    if (itemGroups.armor.contains(id)) return ['armor']
    if (itemGroups.chest.contains(id)) return ['chest']
    if (itemGroups.feet.contains(id)) return ['feet']
    return ['hand']
}

def displayName = { String id ->
    id.split('_').collect { it.substring(0, 1).toUpperCase(Locale.ROOT) + it.substring(1) }.join(' ')
}

def linear = { double base ->
    [type: 'minecraft:linear', base: base, per_level_above_first: base]
}

def damageEffect = { double base ->
    [effect: [type: 'minecraft:add', value: linear(base)]]
}

def protectionEffect = { String sourceTag, double points ->
    [
            effect: [type: 'minecraft:add', value: linear(points)],
            requirements: is26_3
                    ? requirement('minecraft:damage_source_properties', [predicate: [tags: [
                            [expected: true, id: damageTagId(sourceTag)],
                            [expected: false, id: damageTagId('bypasses_invulnerability')]
                    ]]])
                    : [condition: 'minecraft:damage_source_properties', predicate: [tags: [
                            [expected: true, id: damageTagId(sourceTag)],
                            [expected: false, id: damageTagId('bypasses_invulnerability')]
                    ]]]
    ]
}

def postAttackEffect = { Map effect ->
    [affected: 'victim', enchanted: 'attacker', effect: effect]
}

def mobEffect = { id, duration, amplifier ->
    [
            type: 'minecraft:apply_mob_effect',
            to_apply: "minecraft:${id}",
            min_amplifier: amplifier,
            max_amplifier: amplifier,
            min_duration: duration,
            max_duration: linear(duration)
    ]
}

def directHit = {
    requirement('minecraft:damage_source_properties', [predicate: [is_direct: true]])
}

def fireProtection = { double points ->
    protectionEffect('is_fire', points)
}

def multiplyEffect = { double factor ->
    [effect: [type: 'minecraft:multiply', factor: factor]]
}

def arrowAttacker = {
    def predicate = is26_3
            ? ['minecraft:entity_type': '#minecraft:arrows']
            : [type: '#minecraft:arrows']
    requirement('minecraft:entity_properties', [entity: 'direct_attacker', predicate: predicate])
}

def chancePerLevel = { double amount ->
    def requirementData = requirement('minecraft:random_chance')
    requirementData.chance = [type: 'minecraft:enchantment_level', amount: linear(amount)]
    requirementData
}

def effectsFor = { String id ->
    switch (id) {
        case 'overwhelm': return [:]
        case 'lancer': return ['minecraft:damage': [damageEffect(0.5)]]
        case 'reach': return ['minecraft:damage': [damageEffect(0.25)]]
        case 'skewer': return [:]
        case 'counterthrust': return [:]
        case 'debilitate': return [:]
        case 'frostbrand': return [:]
        case 'immolate': return [:]
        case 'firebreak': return [
                'minecraft:attributes': [[
                        amount: [type: 'minecraft:linear', base: -0.20, per_level_above_first: -0.20],
                        attribute: 'minecraft:burning_time',
                        id: 'minecraft:enchantment.firebreak',
                        operation: 'add_multiplied_base'
                ]],
                'minecraft:damage_protection': [fireProtection(1.0)]
        ]
        case 'insight': return ['minecraft:block_experience': [[
                effect: [type: 'minecraft:multiply', factor: [type: 'minecraft:linear', base: 1.30, per_level_above_first: 0.30]]
        ]]]
        case 'steady_aim': return [:]
        case 'backfire': return [:]
        case 'rebound': return ['minecraft:item_damage': [[
                effect: [type: 'minecraft:add', value: linear(-1.0)],
                requirements: chancePerLevel(0.12)
        ]]]
        case 'trawler': return ['minecraft:fishing_luck_bonus': [[
                effect: [type: 'minecraft:add', value: linear(1.0)]
        ]]]
        default: return [:]
    }
}

tasks.register('generateEnchADDResources') {
    inputs.file(catalogFile)
    outputs.dir(generatedDir)
    doLast {
        delete(generatedDir)
        catalog.each { entry ->
            String id = entry[0]
            boolean curse = entry[1] == 'curse'
            def definition = [
                    anvil_cost   : 2,
                    description  : [translate: "enchantment.enchadd.${id}"],
                    effects      : effectsFor(id),
                    max_cost     : [base: curse ? 45 : 40, per_level_above_first: 8],
                    max_level    : maxLevelFor(id, curse),
                    min_cost     : [base: curse ? 15 : 1, per_level_above_first: 8],
                    slots        : slotsFor(id),
                    supported_items: supportedItems(id),
                    weight       : 1
            ]
            def exclusiveSet = exclusiveSetFor(id)
            if (exclusiveSet) definition.exclusive_set = "#${exclusiveSet}"
            def target = new File(generatedDir, "data/enchadd/enchantment/${id}.json")
            target.parentFile.mkdirs()
            target.text = JsonOutput.prettyPrint(JsonOutput.toJson(definition)) + System.lineSeparator()
        }

        def tag = { String name, List<String> ids ->
            def target = new File(generatedDir, "data/minecraft/tags/enchantment/${name}.json")
            target.parentFile.mkdirs()
            target.text = JsonOutput.prettyPrint(JsonOutput.toJson([
                    replace: false,
                    values : ids.collect { "enchadd:${it}" }
            ])) + System.lineSeparator()
        }
        tag('in_enchanting_table', normalIds)
        tag('non_treasure', normalIds)
        tag('curse', curseIds)
        tag('treasure', curseIds)
        tag('on_random_loot', normalIds + curseIds)
        def customEnchantmentTag = { String name, List<String> values ->
            def target = new File(generatedDir, "data/enchadd/tags/enchantment/${name}.json")
            target.parentFile.mkdirs()
            target.text = JsonOutput.prettyPrint(JsonOutput.toJson([replace: false, values: values])) + System.lineSeparator()
        }
        customEnchantmentTag('exclusive_set/executioner_decapitate', ['enchadd:executioner', 'enchadd:decapitate'])
        customEnchantmentTag('exclusive_set/beheading_looting', ['enchadd:beheading', 'minecraft:looting'])

        def packMeta = is26_3
                ? [pack: [description: 'EnchADD data pack', min_format: 121, max_format: 121]]
                : [pack: [description: 'EnchADD data pack', min_format: [94, 1], max_format: 94]]
        new File(generatedDir, 'pack.mcmeta').text = JsonOutput.prettyPrint(JsonOutput.toJson(packMeta)) + System.lineSeparator()
        def lang = new File(generatedDir, 'assets/enchadd/lang/en_us.json')
        lang.parentFile.mkdirs()
        lang.text = JsonOutput.prettyPrint(JsonOutput.toJson(
                catalog.collectEntries { entry ->
                    [("enchantment.enchadd.${entry[0]}"), "EnchADD ${displayName(entry[0])}"]
                }
        )) + System.lineSeparator()
    }
}

tasks.register('validateEnchADDResources') {
    dependsOn(tasks.named('generateEnchADDResources'))
    doLast {
        def expectedEffects = [
                lancer       : 'minecraft:damage',
                reach        : 'minecraft:damage',
                firebreak    : 'minecraft:damage_protection',
                insight      : 'minecraft:block_experience',
                rebound      : 'minecraft:item_damage',
                trawler      : 'minecraft:fishing_luck_bonus'
        ]
        def enchantDir = new File(generatedDir, 'data/enchadd/enchantment')
        def jsonFiles = enchantDir.listFiles({ file -> file.name.endsWith('.json') } as FileFilter) ?: []
        assert jsonFiles.size() == catalog.size(): "Expected ${catalog.size()} enchantments, got ${jsonFiles.size()}"
        def packMeta = new File(generatedDir, 'pack.mcmeta')
        assert packMeta.isFile(): 'Missing generated pack.mcmeta'
        def parser = new JsonSlurper()
        jsonFiles.each { file ->
            def parsed = parser.parse(file)
            assert parsed.description?.translate: "Missing description in ${file.name}"
            assert parsed.weight instanceof Number: "Missing weight in ${file.name}"
        }
        def paperFrostbrandItems = [
                'minecraft:wooden_sword', 'minecraft:stone_sword', 'minecraft:iron_sword',
                'minecraft:golden_sword', 'minecraft:diamond_sword', 'minecraft:netherite_sword',
                'minecraft:wooden_axe', 'minecraft:stone_axe', 'minecraft:iron_axe',
                'minecraft:golden_axe', 'minecraft:diamond_axe', 'minecraft:netherite_axe'
        ] as Set
        def frostbrand = parser.parse(new File(enchantDir, 'frostbrand.json'))
        assert (frostbrand.supported_items as Set) == paperFrostbrandItems:
                'Frostbrand supported_items must match the Paper sword/axe allowlist'
        assert frostbrand.slots == ['hand']: 'Frostbrand must remain a hand-slot enchantment'
        assert frostbrand.effects == [:]: 'Frostbrand custom adapter must be the only slowness proc source'
        def overwhelm = parser.parse(new File(enchantDir, 'overwhelm.json'))
        assert overwhelm.max_level == 2: 'Overwhelm max_level must match Paper'
        def swordAxeItems = paperFrostbrandItems
        ['hemorrhage', 'immolate'].each { id ->
            def parsed = parser.parse(new File(enchantDir, "${id}.json"))
            assert (parsed.supported_items as Set) == swordAxeItems:
                    "${id} supported_items must match the Paper sword/axe allowlist"
        }
        def sunder = parser.parse(new File(enchantDir, 'sunder.json'))
        def axeItems = paperFrostbrandItems.findAll { it.endsWith('_axe') } as Set
        assert (sunder.supported_items as Set) == axeItems:
                'Sunder supported_items must match the Paper axe allowlist'
        def rebound = parser.parse(new File(enchantDir, 'rebound.json'))
        def reboundItems = ['#minecraft:enchantable/mining', '#minecraft:enchantable/durability'] as Set
        assert rebound.max_level == 3 && rebound.slots == ['hand']:
                'Rebound must use the Paper max level and hand slot'
        assert (rebound.supported_items as Set) == reboundItems:
                'Rebound must support Paper mining and durability item tags'
        def reboundEffect = rebound.effects['minecraft:item_damage'][0]
        assert reboundEffect.effect.type == 'minecraft:add'
        assert reboundEffect.effect.value.type == 'minecraft:linear'
        assert reboundEffect.effect.value.base == -1.0
                && reboundEffect.effect.value.per_level_above_first == -1.0
        assert reboundEffect.requirements[requirementType] == 'minecraft:random_chance'
        assert reboundEffect.requirements.chance.type == 'minecraft:enchantment_level'
        assert reboundEffect.requirements.chance.amount.base == 0.12
                && reboundEffect.requirements.chance.amount.per_level_above_first == 0.12:
                'Rebound must refund one durability with a bounded 0.12 chance per level'
        def insight = parser.parse(new File(enchantDir, 'insight.json'))
        assert insight.max_level == 3 && insight.slots == ['hand']
        assert insight.supported_items == '#minecraft:enchantable/mining':
                'Insight must remain a main-hand mining enchantment'
        def insightFactor = insight.effects['minecraft:block_experience'][0].effect.factor
        assert insightFactor.type == 'minecraft:linear'
        assert insightFactor.base == 1.30 && insightFactor.per_level_above_first == 0.30:
                'Insight must increase block XP multiplier by 0.30 per level'
        def chestplates = ['minecraft:leather_chestplate', 'minecraft:chainmail_chestplate',
                'minecraft:iron_chestplate', 'minecraft:golden_chestplate', 'minecraft:diamond_chestplate',
                'minecraft:netherite_chestplate'] as Set
        def debilitate = parser.parse(new File(enchantDir, 'debilitate.json'))
        assert debilitate.max_level == 3
        assert (debilitate.supported_items as Set) == chestplates && debilitate.slots == ['chest']:
                'Debilitate must use the Paper chestplate item and slot restrictions'
        assert debilitate.effects == [:]: 'Debilitate effects are provided by the cooldown-aware event adapter'
        def fragility = parser.parse(new File(enchantDir, 'fragility.json'))
        def fragilityItems = ['#minecraft:enchantable/armor', '#minecraft:enchantable/mining',
                '#minecraft:enchantable/durability'] as Set
        assert fragility.max_level == 3 && fragility.slots == ['any']:
                'Fragility must match Paper max level and all-slot eligibility'
        assert (fragility.supported_items as Set) == fragilityItems:
                'Fragility supported_items must match the Paper armor/mining/durability tags'
        def shatter = parser.parse(new File(enchantDir, 'shatter.json'))
        def shatterItems = ['#minecraft:enchantable/weapon', '#minecraft:enchantable/mining'] as Set
        assert shatter.max_level == 3 && shatter.slots == ['hand']:
                'Shatter must match Paper max level and main-hand eligibility'
        assert (shatter.supported_items as Set) == shatterItems:
                'Shatter supported_items must match the Paper weapon/mining tags'
        assert fragility.effects == [:] && shatter.effects == [:]:
                'Durability curses must use the shared durability adapter only'
        def backfire = parser.parse(new File(enchantDir, 'backfire.json'))
        assert backfire.max_level == 1 && backfire.slots == ['hand']
        assert (backfire.supported_items as Set) == ['#minecraft:enchantable/weapon'] as Set:
                'Backfire must be limited to its main-hand weapon'
        def executioner = parser.parse(new File(enchantDir, 'executioner.json'))
        assert executioner.max_level == 5 && executioner.slots == ['hand']
        assert executioner.supported_items == '#minecraft:enchantable/weapon'
        assert executioner.exclusive_set == '#enchadd:exclusive_set/executioner_decapitate'
        assert executioner.effects == [:]: 'Executioner must use the shared melee damage adapter only'
        def executionerBehavior = new File(project.projectDir, '../common/src/main/java/net/enchadd/mod/common/MeleeEffectBehavior.java')
        assert executionerBehavior.text.contains('victim.getHealth() / maxHealth < 0.25')
        assert executionerBehavior.text.contains('Math.min(5, EnchantmentHelper.getItemEnchantmentLevel(executionerHolder, attacker.getMainHandItem()))')
        assert executionerBehavior.text.contains('Math.min(2.5, 1.0 + 0.05 * executionerLevel)'):
                'Executioner must preserve the Paper health threshold and damage multiplier'
        def beheading = parser.parse(new File(enchantDir, 'beheading.json'))
        assert beheading.max_level == 1 && beheading.slots == ['hand']
        assert (beheading.supported_items as Set) == ['#minecraft:axes'] as Set:
                'Beheading must match Paper max level and axe-only eligibility'
        assert beheading.exclusive_set == '#enchadd:exclusive_set/beheading_looting'
        assert beheading.effects == [:]: 'Beheading must use the shared death adapter only'
        def decapitate = parser.parse(new File(enchantDir, 'decapitate.json'))
        def decapitateItems = ['#minecraft:swords', '#minecraft:axes'] as Set
        assert decapitate.max_level == 3 && decapitate.slots == ['hand']
        assert (decapitate.supported_items as Set) == decapitateItems:
                'Decapitate must match Paper sword/axe eligibility'
        assert decapitate.exclusive_set == executioner.exclusive_set
        def exclusiveSetDir = new File(generatedDir, 'data/enchadd/tags/enchantment/exclusive_set')
        def executionerConflicts = parser.parse(new File(exclusiveSetDir, 'executioner_decapitate.json'))
        assert (executionerConflicts.values as Set) == ['enchadd:executioner', 'enchadd:decapitate'] as Set
        def beheadingConflicts = parser.parse(new File(exclusiveSetDir, 'beheading_looting.json'))
        assert (beheadingConflicts.values as Set) == ['enchadd:beheading', 'minecraft:looting'] as Set:
                'Exclusive sets must match Paper Executioner/Decapitate and Beheading/Looting conflicts'
        assert decapitate.effects == [:]: 'Decapitate must use the shared death adapter only'
        def headDrops = new File(project.projectDir, '../common/src/main/java/net/enchadd/mod/common/HeadDropBehavior.java')
        assert headDrops.isFile(): 'Missing shared Beheading/Decapitate behavior'
        assert headDrops.text.contains('Math.min(MAX_BEHEADING_LEVEL, EnchantmentHelper.getEnchantmentLevel(beheading, attacker))')
        assert headDrops.text.contains('Math.min(0.5, 0.1 * beheadingLevel)')
        assert headDrops.text.contains('Math.min(MAX_DECAPITATE_LEVEL, EnchantmentHelper.getEnchantmentLevel(decapitate, attacker))')
        assert headDrops.text.contains('Math.min(0.3, 0.1 * decapitateLevel)')
        assert headDrops.text.contains('source.getDirectEntity() != source.getEntity()')
        ['zombie', 'skeleton', 'wither_skeleton', 'creeper', 'ender_dragon', 'piglin'].each { entityType ->
            assert headDrops.text.contains('type.equals("' + entityType + '")'):
                    "Beheading must preserve Paper head mapping for ${entityType}"
        }
        ['husk', 'drowned', 'stray', 'bogged', 'piglin_brute', 'zombified_piglin'].each { entityType ->
            assert !headDrops.text.contains('type.equals("' + entityType + '")'):
                    "Beheading must not broaden Paper head drops to ${entityType}"
        }
        assert headDrops.text.contains('ResolvableProfile.createResolved(player.getGameProfile())'):
                'Player-head drops must retain the killed player profile'
        def weaponItems = ['minecraft:wooden_sword', 'minecraft:stone_sword', 'minecraft:iron_sword',
                'minecraft:golden_sword', 'minecraft:diamond_sword', 'minecraft:netherite_sword',
                'minecraft:wooden_axe', 'minecraft:stone_axe', 'minecraft:iron_axe',
                'minecraft:golden_axe', 'minecraft:diamond_axe', 'minecraft:netherite_axe',
                'minecraft:trident'] as Set
        ['cadence', 'underdog', 'initiative', 'wingclip', 'tracer', 'pursuit'].each { id ->
            def parsed = parser.parse(new File(enchantDir, "${id}.json"))
            assert parsed.max_level == 3 && parsed.slots == ['hand']
            assert (parsed.supported_items as Set) == weaponItems:
                    "${id} must match the Paper sword/axe/trident allowlist"
            assert parsed.effects == [:]: "${id} must use the shared melee adapter only"
        }
        def rally = parser.parse(new File(enchantDir, 'rally.json'))
        assert rally.max_level == 3 && rally.slots == ['chest']
        assert (rally.supported_items as Set) == chestplates:
                'Rally must match the Paper chestplate allowlist'
        assert rally.effects == [:]: 'Rally must use the shared melee adapter only'
        expectedEffects.each { id, effectKey ->
            def file = new File(enchantDir, "${id}.json")
            assert file.isFile(): "Missing migrated enchantment ${id}"
            def parsed = parser.parse(file)
            assert parsed.effects?.containsKey(effectKey): "${id} missing expected effect ${effectKey}"
        }
    }
}

tasks.register('validateEnchADDBehaviorAdapters') {
    dependsOn(tasks.named('validateEnchADDResources'))
    doLast {
        def commonBehavior = new File(project.projectDir, '../common/src/main/java/net/enchadd/mod/common/DamageProtectionBehavior.java')
        assert commonBehavior.isFile(): 'Missing shared armor damage protection behavior'
        def debilitateBehavior = new File(project.projectDir, '../common/src/main/java/net/enchadd/mod/common/DebilitateBehavior.java')
        assert debilitateBehavior.isFile(): 'Missing shared Debilitate event behavior'
        def spearDefense = new File(project.projectDir, '../common/src/main/java/net/enchadd/mod/common/SpearDefenseBehavior.java')
        assert spearDefense.isFile(): 'Missing Counterthrust shared behavior'
        def spearCombat = new File(project.projectDir, '../common/src/main/java/net/enchadd/mod/common/SpearCombatBehavior.java')
        assert spearCombat.isFile(): 'Missing Skewer shared behavior'
        def backfire = new File(project.projectDir, '../common/src/main/java/net/enchadd/mod/common/BackfireBehavior.java')
        assert backfire.isFile(): 'Missing Backfire shared behavior'
        def mobExperience = new File(project.projectDir, '../common/src/main/java/net/enchadd/mod/common/MobExperienceBehavior.java')
