        def backfireBehavior = new File(project.projectDir, '../common/src/main/java/net/enchadd/mod/common/BackfireBehavior.java')
        assert backfireBehavior.text.contains('source.getDirectEntity() != player'):
                'Backfire must require a direct player attack'
        def meleeBehavior = new File(project.projectDir, '../common/src/main/java/net/enchadd/mod/common/MeleeEffectBehavior.java')
        assert meleeBehavior.isFile(): 'Missing shared melee effect behavior'
        ['CADENCE', 'UNDERDOG', 'RALLY', 'INITIATIVE', 'WINGCLIP', 'TRACER', 'PURSUIT', 'EXECUTIONER'].each { id ->
            assert meleeBehavior.text.contains('key("' + id.toLowerCase(Locale.ROOT) + '")'):
                    "Shared melee behavior must define ${id}"
        }
        assert meleeBehavior.text.contains('victim.getHealth() / maxHealth < 0.25')
        assert meleeBehavior.text.contains('Math.min(5, EnchantmentHelper.getItemEnchantmentLevel(executionerHolder, attacker.getMainHandItem()))')
        assert meleeBehavior.text.contains('Math.min(2.5, 1.0 + 0.05 * executionerLevel)'):
                'Executioner must use Paper low-health threshold and bounded multiplier defaults'
        def headDrops = new File(project.projectDir, '../common/src/main/java/net/enchadd/mod/common/HeadDropBehavior.java')
        assert headDrops.isFile(): 'Missing shared beheading and decapitation behavior'
        ['BEHEADING', 'DECAPITATE'].each { id ->
            assert headDrops.text.contains('key("' + id.toLowerCase(Locale.ROOT) + '")'):
                    "Shared head-drop behavior must define ${id}"
        }
        assert headDrops.text.contains('Math.min(MAX_BEHEADING_LEVEL, EnchantmentHelper.getEnchantmentLevel(beheading, attacker))')
        assert headDrops.text.contains('Math.min(MAX_DECAPITATE_LEVEL, EnchantmentHelper.getEnchantmentLevel(decapitate, attacker))')
