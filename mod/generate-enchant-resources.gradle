enchadd1211TagItems.armor = ['head_armor', 'chest_armor', 'leg_armor', 'foot_armor'].collectMany { enchadd1211TagItems[it] }.unique()
def legacyTagItems = { String tag ->
    if (!enchadd1211TagItems.containsKey(tag) || enchadd1211TagItems[tag].isEmpty()) throw new GradleException('Unknown or empty 1.21.1 item tag: ' + tag)
    enchadd1211TagItems[tag]
}
def groupTag = { group ->
    [shield: 'durability', chest: 'chest_armor', feet: 'foot_armor', armor: 'armor'][group?.key] ?: group?.key
}
def tagExp = { String tag -> (isLegacy) ? (enchadd1211TagItems[tag] as Set) : (tag in ["axes","swords"] ? "#minecraft:" + tag : "#minecraft:enchantable/" + tag) }
def synthTagQueue = []
def makeSynthTag = { List<String> tagRefs ->
    def key = "synth-" + tagRefs.sort().collect { it.replace("minecraft:", "").replaceAll("[^a-z0-9]", "-") }.join("-")
    def values = tagRefs.collect { "#" + it }
    synthTagQueue << [key: key, values: values]
    return "#enchadd:" + key
}
def supportedItems = { String id ->
    if (id in ['afterglide', 'skim', 'airbag', 'wingguard']) return ['minecraft:elytra']
    if (id == 'bulwark') return ['minecraft:shield']
    if (id in ['purify', 'lucidity', 'clairvoyance']) return [
            'minecraft:leather_helmet', 'minecraft:chainmail_helmet', 'minecraft:iron_helmet',
            'minecraft:golden_helmet', 'minecraft:diamond_helmet', 'minecraft:netherite_helmet',
            'minecraft:turtle_helmet'
    ]
    if (id == 'dispel') return [
            'minecraft:wooden_sword', 'minecraft:stone_sword', 'minecraft:iron_sword',
            'minecraft:golden_sword', 'minecraft:diamond_sword', 'minecraft:netherite_sword',
            'minecraft:wooden_axe', 'minecraft:stone_axe', 'minecraft:iron_axe',
            'minecraft:golden_axe', 'minecraft:diamond_axe', 'minecraft:netherite_axe'
    ]
    if (id == 'ricochet') return ['minecraft:bow', 'minecraft:crossbow']
    if (id == 'brittle') return [
            'minecraft:leather_leggings', 'minecraft:chainmail_leggings', 'minecraft:iron_leggings',
            'minecraft:golden_leggings', 'minecraft:diamond_leggings', 'minecraft:netherite_leggings'
    ]
    if (id == 'shroud') return [
            'minecraft:leather_leggings', 'minecraft:chainmail_leggings', 'minecraft:iron_leggings',
            'minecraft:golden_leggings', 'minecraft:diamond_leggings', 'minecraft:netherite_leggings'
    ]
    if (id == 'freshcatch') return ['minecraft:fishing_rod']
    def catalogEntry = catalog.find { it[0] == id }
    if (catalogEntry?.size() > 2 && catalogEntry[2].trim()) {
        def raw = catalogEntry[2].split(';').collect { it.trim() }
        if (isLegacy) return raw.collect { it.startsWith('#') ? legacyTagItems(it.substring(1).replace('minecraft:enchantable/','').replace('minecraft:','')) : it }.flatten().unique()
        if (raw.size() == 1 && raw[0].startsWith('#')) return raw[0]
        if (raw.every { it.startsWith('#') }) return makeSynthTag(raw.collect { it.substring(1) })
        return raw
    }
    if (id == 'tideshell') return ['minecraft:nautilus_shell']
    if (spearIds.contains(id)) {
        return (isLegacy) ? legacyTagItems('weapon') : ['minecraft:wooden_spear', 'minecraft:stone_spear', 'minecraft:copper_spear',
                'minecraft:iron_spear', 'minecraft:golden_spear', 'minecraft:diamond_spear',
                'minecraft:netherite_spear', 'minecraft:trident']
    }
    def group = itemGroups.find { it.value.contains(id) }
    if (isLegacy) return legacyTagItems(group ? groupTag(group) : 'durability')
    def tagName = [shield: 'durability', chest: 'chest_armor', feet: 'foot_armor'][group?.key] ?: group?.key
    return group ? "#minecraft:enchantable/${tagName}" : '#minecraft:enchantable/durability'
}

def slotsFor = { String id ->
    if (id == 'fragility') return ['any']
    if (id in ['afterglide', 'skim', 'airbag', 'wingguard']) return ['chest']
    if (id == 'tideshell') return ['mainhand']
    if (id == 'brittle') return ['legs']
    if (id in ['purify', 'lucidity', 'clairvoyance']) return ['head']
    if (id in ['dispel', 'ricochet', 'freshcatch']) return ['mainhand']
    if (id == 'shroud') return ['legs']
    if (itemGroups.shield.contains(id)) return ['offhand']
    if (itemGroups.armor.contains(id)) return ['armor']
    if (itemGroups.chest.contains(id)) return ['chest']
    if (itemGroups.feet.contains(id)) return ['feet']
    return ['hand']
}

def displayName = { String id ->
    id.split('_').collect { it.substring(0, 1).toUpperCase(Locale.ROOT) + it.substring(1) }.join(' ')
}

def linear = { double base ->
    [type: 'minecraft:linear', base: base, per_level_above_first: base]
}

def damageEffect = { double base ->
    [effect: [type: 'minecraft:add', value: linear(base)]]
}

def protectionEffect = { String sourceTag, double points ->
    [
            effect: [type: 'minecraft:add', value: linear(points)],
            requirements: is26_3
                    ? requirement('minecraft:damage_source_properties', [predicate: [tags: [
                            [expected: true, id: damageTagId(sourceTag)],
                            [expected: false, id: damageTagId('bypasses_invulnerability')]
                    ]]])
                    : [condition: 'minecraft:damage_source_properties', predicate: [tags: [
                            [expected: true, id: damageTagId(sourceTag)],
                            [expected: false, id: damageTagId('bypasses_invulnerability')]
                    ]]]
    ]
}

def postAttackEffect = { Map effect ->
    [affected: 'victim', enchanted: 'attacker', effect: effect]
}

def mobEffect = { id, duration, amplifier ->
    [
            type: 'minecraft:apply_mob_effect',
            to_apply: "minecraft:${id}",
            min_amplifier: amplifier,
            max_amplifier: amplifier,
            min_duration: duration,
            max_duration: linear(duration)
    ]
}

def directHit = {
    requirement('minecraft:damage_source_properties', [predicate: [is_direct: true]])
}

def fireProtection = { double points ->
    protectionEffect('is_fire', points)
}

def multiplyEffect = { double factor ->
    [effect: [type: 'minecraft:multiply', factor: factor]]
}

def arrowAttacker = {
    def predicate = is26_3
            ? ['minecraft:entity_type': '#minecraft:arrows']
            : [type: '#minecraft:arrows']
    requirement('minecraft:entity_properties', [entity: 'direct_attacker', predicate: predicate])
}

def chancePerLevel = { double amount ->
    def requirementData = requirement('minecraft:random_chance')
    requirementData.chance = [type: 'minecraft:enchantment_level', amount: linear(amount)]
    requirementData
}

def effectsFor = { String id ->
    switch (id) {
        case 'overwhelm': return [:]
        case 'lancer': return ['minecraft:damage': [damageEffect(0.5)]]
        case 'reach': return ['minecraft:damage': [damageEffect(0.25)]]
        case 'skewer': return [:]
        case 'counterthrust': return [:]
        case 'debilitate': return [:]
        case 'frostbrand': return [:]
        case 'immolate': return [:]
        case 'firebreak': return [
                'minecraft:attributes': [[
                        amount: [type: 'minecraft:linear', base: -0.20, per_level_above_first: -0.20],
                        attribute: is1_21_1 ? 'minecraft:generic.burning_time' : 'minecraft:burning_time',
                        id: 'minecraft:enchantment.firebreak',
                        operation: 'add_multiplied_base'
                ]],
                'minecraft:damage_protection': [fireProtection(1.0)]
        ]
        case 'insight': return ['minecraft:block_experience': [[
                effect: [type: 'minecraft:multiply', factor: [type: 'minecraft:linear', base: 1.30, per_level_above_first: 0.30]]
        ]]]
        case 'steady_aim': return [:]
        case 'backfire': return [:]
        case 'rebound': return ['minecraft:item_damage': [[
                effect: [type: 'minecraft:add', value: linear(-1.0)],
                requirements: chancePerLevel(0.12)
        ]]]
        case 'trawler': return ['minecraft:fishing_luck_bonus': [[
                effect: [type: 'minecraft:add', value: linear(1.0)]
        ]]]
        default: return [:]
    }
}

tasks.register('generateEnchADDResources') {
    inputs.file(catalogFile)
    outputs.dir(generatedDir)
    doLast {
        delete(generatedDir)
        catalog.each { entry ->
            String id = entry[0]
            boolean curse = entry[1] == 'curse'
            def definition = [
                    anvil_cost   : 2,
                    description  : [translate: "enchantment.enchadd.${id}"],
                    effects      : effectsFor(id),
                    max_cost     : [base: curse ? 45 : 40, per_level_above_first: 8],
                    max_level    : maxLevelFor(id, curse),
                    min_cost     : [base: curse ? 15 : 1, per_level_above_first: 8],
                    slots        : slotsFor(id),
                    supported_items: supportedItems(id),
                    weight       : 1
            ]
            def exclusiveSet = exclusiveSetFor(id)
            if (exclusiveSet) definition.exclusive_set = "#${exclusiveSet}"
            def target = new File(generatedDir, "data/enchadd/enchantment/${id}.json")
            target.parentFile.mkdirs()
            target.text = JsonOutput.prettyPrint(JsonOutput.toJson(definition)) + System.lineSeparator()
        }

        def tag = { String name, List<String> ids ->
            def target = new File(generatedDir, "data/minecraft/tags/enchantment/${name}.json")
            target.parentFile.mkdirs()
            target.text = JsonOutput.prettyPrint(JsonOutput.toJson([
                    replace: false,
                    values : ids.collect { "enchadd:${it}" }
            ])) + System.lineSeparator()
        }
        tag('in_enchanting_table', normalIds)
        tag('non_treasure', normalIds)
        tag('curse', curseIds)
        tag('treasure', curseIds)
        tag('on_random_loot', normalIds + curseIds)
        def customEnchantmentTag = { String name, List<String> values ->
            def target = new File(generatedDir, "data/enchadd/tags/enchantment/${name}.json")
            target.parentFile.mkdirs()
            target.text = JsonOutput.prettyPrint(JsonOutput.toJson([replace: false, values: values])) + System.lineSeparator()
        }
        customEnchantmentTag('exclusive_set/executioner_decapitate', ['enchadd:executioner', 'enchadd:decapitate'])
        customEnchantmentTag('exclusive_set/beheading_looting', ['enchadd:beheading', 'minecraft:looting'])

        synthTagQueue.each { st ->
            def t = new File(generatedDir, "data/enchadd/tags/item/${st.key}.json")
            t.parentFile.mkdirs()
            t.text = JsonOutput.prettyPrint(JsonOutput.toJson([replace: false, values: st.values])) + System.lineSeparator()
        }
        def packMeta = is26_3
                ? [pack: [description: 'EnchADD data pack', min_format: 121, max_format: 121]]
        : (is1_21_1 ? [pack: [description: 'EnchADD data pack', pack_format: 48]] : (isG2 ? [pack: [description: 'EnchADD data pack', pack_format: 71]] : (isG3int ? [pack: [description: 'EnchADD data pack', pack_format: 80]] : [pack: [description: 'EnchADD data pack', min_format: [94, 1], max_format: 94]])))
        new File(generatedDir, 'pack.mcmeta').text = JsonOutput.prettyPrint(JsonOutput.toJson(packMeta)) + System.lineSeparator()
        def lang = new File(generatedDir, 'assets/enchadd/lang/en_us.json')
        lang.parentFile.mkdirs()
        lang.text = JsonOutput.prettyPrint(JsonOutput.toJson(
                catalog.collectEntries { entry ->
                    [("enchantment.enchadd.${entry[0]}"), "EnchADD ${displayName(entry[0])}"]
                }
        )) + System.lineSeparator()
    }
}

tasks.register('validateEnchADDResources') {
    dependsOn(tasks.named('generateEnchADDResources'))
    doLast {
        def expectedEffects = [
                lancer       : 'minecraft:damage',
                reach        : 'minecraft:damage',
                firebreak    : 'minecraft:damage_protection',
                insight      : 'minecraft:block_experience',
                rebound      : 'minecraft:item_damage',
                trawler      : 'minecraft:fishing_luck_bonus'
        ]
        def enchantDir = new File(generatedDir, 'data/enchadd/enchantment')
        def jsonFiles = enchantDir.listFiles({ file -> file.name.endsWith('.json') } as FileFilter) ?: []
        assert jsonFiles.size() == catalog.size(): "Expected ${catalog.size()} enchantments, got ${jsonFiles.size()}"
        def packMeta = new File(generatedDir, 'pack.mcmeta')
        assert packMeta.isFile(): 'Missing generated pack.mcmeta'
        def parser = new JsonSlurper()
        jsonFiles.each { file ->
            def parsed = parser.parse(file)
            assert parsed.description?.translate: "Missing description in ${file.name}"
            assert parsed.weight instanceof Number: "Missing weight in ${file.name}"
            if (is1_21_1) {
                assert parsed.supported_items instanceof List && !parsed.supported_items.isEmpty():
                        "1.21.1 item allowlist must be nonempty: ${file.name}"
                assert parsed.supported_items.every { !it.startsWith('#') }:
                        "1.21.1 item allowlist contains an unexpanded tag: ${file.name}"
                if (parsed.slots == ['armor']) {
                    assert enchadd1211TagItems.armor.containsAll(parsed.supported_items):
                            "Armor enchantment accepts non-armor items: ${file.name}"
                }
            }
        }
        def paperFrostbrandItems = [
                'minecraft:wooden_sword', 'minecraft:stone_sword', 'minecraft:iron_sword',
                'minecraft:golden_sword', 'minecraft:diamond_sword', 'minecraft:netherite_sword',
                'minecraft:wooden_axe', 'minecraft:stone_axe', 'minecraft:iron_axe',
                'minecraft:golden_axe', 'minecraft:diamond_axe', 'minecraft:netherite_axe'
        ] as Set
        def frostbrand = parser.parse(new File(enchantDir, 'frostbrand.json'))
        assert (frostbrand.supported_items as Set) == paperFrostbrandItems:
                'Frostbrand supported_items must match the Paper sword/axe allowlist'
        assert frostbrand.slots == ['hand']: 'Frostbrand must remain a hand-slot enchantment'
        assert frostbrand.effects == [:]: 'Frostbrand custom adapter must be the only slowness proc source'
        def overwhelm = parser.parse(new File(enchantDir, 'overwhelm.json'))
        assert overwhelm.max_level == 2: 'Overwhelm max_level must match Paper'
        def swordAxeItems = paperFrostbrandItems
        ['hemorrhage', 'immolate'].each { id ->
            def parsed = parser.parse(new File(enchantDir, "${id}.json"))
            assert (parsed.supported_items as Set) == swordAxeItems:
                    "${id} supported_items must match the Paper sword/axe allowlist"
        }
        def sunder = parser.parse(new File(enchantDir, 'sunder.json'))
        def axeItems = paperFrostbrandItems.findAll { it.endsWith('_axe') } as Set
        assert (sunder.supported_items as Set) == axeItems:
                'Sunder supported_items must match the Paper axe allowlist'
        def rebound = parser.parse(new File(enchantDir, 'rebound.json'))
def reboundItems = (isLegacy) ? ((enchadd1211TagItems['mining'] + enchadd1211TagItems['durability']) as Set) : (['#minecraft:enchantable/mining', '#minecraft:enchantable/durability'] as Set)
        assert rebound.max_level == 3 && rebound.slots == ['hand']:
                'Rebound must use the Paper max level and hand slot'
        assert (isLegacy) ? (rebound.supported_items as Set) == reboundItems : (rebound.supported_items instanceof String && rebound.supported_items.startsWith('#enchadd:synth-')):
                'Rebound must support Paper mining and durability item tags'
        def reboundEffect = rebound.effects['minecraft:item_damage'][0]
        assert reboundEffect.effect.type == 'minecraft:add'
        assert reboundEffect.effect.value.type == 'minecraft:linear'
        assert reboundEffect.effect.value.base == -1.0
                && reboundEffect.effect.value.per_level_above_first == -1.0
        assert reboundEffect.requirements[requirementType] == 'minecraft:random_chance'
