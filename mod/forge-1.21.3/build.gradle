plugins {
    id 'net.minecraftforge.gradle' version '7.0.29'
    id 'java'
}

base.archivesName = 'enchadd-forge'
version = mod_version
sourceSets.main.java.srcDir('common-g2')
sourceSets.main.resources.srcDir('../common/src/main/resources')
apply from: rootProject.file(rootProject.name == 'enchadd-mod'
        ? 'generate-enchant-resources.gradle'
        : '../generate-enchant-resources.gradle')

minecraft {
    mappings channel: 'official', version: minecraft_version
    runs {
        configureEach { workingDir = project.file('run') }
        server { args '--nogui' }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}
dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
}
tasks.withType(JavaCompile).configureEach { options.release = Integer.parseInt(java_release); options.encoding = 'UTF-8' }
java { toolchain.languageVersion = JavaLanguageVersion.of(Integer.parseInt(java_release)) }
processResources { inputs.property 'version', project.version; filesMatching('META-INF/mods.toml') { expand project.properties } }

jar { manifest { attributes['MixinConfigs'] = 'enchadd.mixins.json' } }
