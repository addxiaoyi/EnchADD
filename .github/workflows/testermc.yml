name: Paper Version Integration Tests

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  test-paper:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        paper_version:
          - "1.21.10"
          - "1.21.11"
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Validate Paper integration test assets
        run: mvn -B -pl tests/papermc -am test

      - name: Build plugin jar
        run: mvn -B -pl plugin -am package -DskipTests

      - name: Run deterministic Paper smoke on ${{ matrix.paper_version }}
        shell: bash
        run: |
          set -euo pipefail
          PLUGIN_JAR="$(find plugin/target -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | sort | head -n 1)"
          if [[ -z "$PLUGIN_JAR" ]]; then
            echo "No plugin runtime jar found in plugin/target" >&2
            exit 1
          fi
          python3 tests/papermc/scripts/run_paper_integration.py \
            --paper-version "${{ matrix.paper_version }}" \
            --plugin-jar "$PLUGIN_JAR" \
            --commands-file tests/papermc/src/test/resources/testermc/commands.txt \
            --fixtures-dir tests/papermc/src/test/resources/testermc/files \
            --startup-timeout-seconds 420

      - name: Generate enchant catalog snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/papermc/scripts/generate_enchant_catalog.py \
            --repo-root . \
            --json-out tests/papermc/target/perf-gate/enchant-catalog.json \
            --md-out tests/papermc/target/perf-gate/enchant-catalog.md \
            --fail-on-unclassified

      - name: Upload Paper smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-smoke-log-${{ matrix.paper_version }}
          path: |
            tests/papermc/target/paper-logs/paper-${{ matrix.paper_version }}.log
            tests/papermc/target/perf-gate/enchant-catalog.json
            tests/papermc/target/perf-gate/enchant-catalog.md
