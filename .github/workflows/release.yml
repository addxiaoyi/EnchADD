name: Release
on:
  push:
    tags:
      - "*"
jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Validate Config
        shell: pwsh
        run: ./scripts/dev-tools.ps1 -Task validate-config
      - name: Check Paper API
        shell: pwsh
        run: ./scripts/dev-tools.ps1 -Task check-paper
      - name: Build Plugin
        shell: pwsh
        run: ./scripts/dev-tools.ps1 -Task build -OutputDir dist
      - name: Enchant Coverage Report
        shell: pwsh
        run: ./scripts/dev-tools.ps1 -Task enchant-coverage-report
      - name: Environment Info
        shell: pwsh
        run: ./scripts/collect-env-info.ps1 -OutPath dist/env-info.txt
      - name: Generate Release Notes
        shell: pwsh
        run: ./scripts/generate-release-notes.ps1 -OutPath dist/release-notes.md
      - name: Generate Checksums
        shell: pwsh
        run: ./scripts/generate-sha256.ps1 -Dir dist -OutFile dist/checksums.txt
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/**
          body_path: dist/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
