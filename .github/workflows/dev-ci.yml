name: Dev CI
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
jobs:
  validate-and-build:
    runs-on: windows-latest
    strategy:
      matrix:
        java_version: ["21", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java_version }}
          cache: maven
      - name: Environment Info
        shell: pwsh
        run: |
          mvn -version | Out-File -FilePath env-info.txt -Encoding utf8
          java -version 2>&1 | Out-File -FilePath env-info.txt -Append -Encoding utf8
          javac -version 2>&1 | Out-File -FilePath env-info.txt -Append -Encoding utf8
      - name: Upload Environment Info
        uses: actions/upload-artifact@v7
        with:
          name: env-info-${{ matrix.java_version }}
          path: env-info.txt
      - name: Validate Project Config
        shell: pwsh
        run: ./scripts/dev-tools.ps1 -Task validate-config
      - name: Check Paper API Consistency
        id: check_paper
        continue-on-error: true
        shell: pwsh
        run: ./scripts/dev-tools.ps1 -Task check-paper
      - name: Fix Paper API Inconsistency
        if: ${{ steps.check_paper.conclusion == 'failure' }}
        shell: pwsh
        run: ./scripts/dev-tools.ps1 -Task fix-paper-api
      - name: Re-Check Paper API
        shell: pwsh
        run: ./scripts/dev-tools.ps1 -Task check-paper
      - name: Enchant Coverage
        shell: pwsh
        run: ./scripts/dev-tools.ps1 -Task enchant-coverage
      - name: Enchant Coverage Report
        shell: pwsh
        run: ./scripts/dev-tools.ps1 -Task enchant-coverage-report
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v7
        with:
          name: enchant-coverage-report
          path: dist/reports/**
      - name: Hot Events Scan
        shell: pwsh
        run: ./scripts/dev-tools.ps1 -Task hot-events
      - name: Build Plugin
        shell: pwsh
        run: ./scripts/dev-tools.ps1 -Task build -OutputDir dist
      - name: Upload Plugin Artifact
        uses: actions/upload-artifact@v7
        with:
          name: plugin-jar
          path: dist/**
  compat-build:
    runs-on: windows-latest
    strategy:
      matrix:
        paper_version: ["1.21.10-R0.1-SNAPSHOT", "1.21.11-R0.1-SNAPSHOT"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Environment Info
        shell: pwsh
        run: |
          mvn -version | Out-File -FilePath env-info.txt -Encoding utf8
          java -version 2>&1 | Out-File -FilePath env-info.txt -Append -Encoding utf8
          javac -version 2>&1 | Out-File -FilePath env-info.txt -Append -Encoding utf8
      - name: Set Paper API Version
        shell: pwsh
        env:
          PAPER_VERSION: ${{ matrix.paper_version }}
        run: |
          $path = "pom.xml"
          $content = Get-Content $path -Raw
          $pattern = '(?s)(<dependency>\s*<groupId>io\.papermc\.paper</groupId>\s*<artifactId>paper-api</artifactId>\s*<version>)[^<]+(</version>)'
          $updated = [regex]::Replace($content,$pattern,"`$1$env:PAPER_VERSION`$2")
          Set-Content $path $updated
      - name: Fix Paper API Inconsistency
        shell: pwsh
        run: ./scripts/dev-tools.ps1 -Task fix-paper-api
      - name: Build Plugin
        shell: pwsh
        run: ./scripts/dev-tools.ps1 -Task build -OutputDir dist
      - name: Upload Matrix Artifact
        uses: actions/upload-artifact@v7
        with:
          name: plugin-jar-${{ matrix.paper_version }}
          path: dist/**
      - name: Upload Environment Info
        uses: actions/upload-artifact@v7
        with:
          name: env-info-${{ matrix.paper_version }}
          path: env-info.txt
  build-docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "docs/package-lock.json"
      - name: Install
        run: npm ci
      - name: Build Docs
        run: npm run build
      - name: Audit Docs
        run: npm audit --json > audit.json || true
      - name: Upload Audit Report
        uses: actions/upload-artifact@v7
        with:
          name: docs-audit
          path: docs/audit.json
      - name: Upload Docs
        uses: actions/upload-artifact@v7
        with:
          name: docs-dist
          path: docs/dist/**
